name: Weekcontrole

on:
  # Elke zondag. GitHub start geplande taken vaak uren later dan gevraagd (gemeten: 4 tot 5 uur).
  # Tot 05-10-2026 stond hier een controle "is het 12 uur in Nederland?"; door die vertraging
  # sloeg die elke week alles over, terwijl de run toch groen werd. Daarom geen tijdscontrole meer:
  # de controle draait op zondag zodra GitHub eraan toekomt.
  schedule:
    - cron: "0 10 * * 0"   # zondag 10:00 UTC (12:00 zomertijd, 11:00 wintertijd), of later
  workflow_dispatch:        # zelf starten mag altijd

concurrency:
  group: weekcontrole
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  controle:
    runs-on: ubuntu-latest
    env:
      # Meldingen gaan standaard NIET direct naar mail of WhatsApp: de uitslag komt
      # in STATUS.md, die leg je voor aan Claude. Wil je toch direct bericht,
      # zet dan het secret MELD_DIRECT op 1.
      MELD_DIRECT: ${{ secrets.MELD_DIRECT }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      - name: Alle sites controleren
        id: check
        continue-on-error: true
        env:
          PROXY_KEY: ${{ secrets.PROXY_KEY }}   # zelfde waarde als PROXY_KEY in Cloudflare
        run: node tools/kaap-check.mjs "https://kaap-proxy.kelliankaap.workers.dev/"

      - name: Storing samenvatten in het overzicht
        if: steps.check.outcome == 'failure'
        run: |
          echo "### Storing bij de weekcontrole" >> $GITHUB_STEP_SUMMARY
          echo "Zie STATUS.md in de repo en leg het blok 'Voorleggen aan Claude' voor." >> $GITHUB_STEP_SUMMARY

      - name: STATUS.md vastleggen
        run: |
          git config user.name "kaap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add STATUS.md
          git diff --cached --quiet || git commit -m "Weekcontrole $(TZ=Europe/Amsterdam date '+%d-%m-%Y')"
          git pull --rebase --quiet   # er kan intussen iets gepusht zijn
          git push

      - name: Mail bij storing
        if: steps.check.outcome == 'failure' && env.MELD_DIRECT == '1' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "KAAP Inkoop Radar — storing bij de weekcontrole"
          to: ${{ secrets.MAIL_TO }}
          from: KAAP Inkoop Radar
          body: file://STATUS.md

      - name: WhatsApp bij storing
        if: steps.check.outcome == 'failure' && env.MELD_DIRECT == '1' && env.CALLMEBOT_PHONE != ''
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          tekst="KAAP weekcontrole: een of meer sites werken niet. Zie STATUS.md in de repo."
          curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$CALLMEBOT_PHONE" \
            --data-urlencode "apikey=$CALLMEBOT_APIKEY" \
            --data-urlencode "text=$tekst" -o /dev/null
