# KAAP Inkoop-radar – ophaler
# Draait elke 2 uur, dag en nacht: leest profiles.json, schrijft results.json en stuurt
# optioneel een e-mail bij nieuwe advertenties en prijsdalingen.
name: Inkoop-radar

on:
  # Elke 2 uur, op 17 minuten over het uur (UTC). Naast het hele uur start GitHub meestal
  # sneller; op het hele uur is het druk. Ook dan begint GitHub geplande taken vaak later en
  # slaat er bij drukte soms een over. Voor inkoop maakt dat niets uit.
  #
  # Mail bij nieuw aanbod: zet de secrets MAIL_TO, MAIL_USERNAME en MAIL_PASSWORD
  # (Settings > Secrets and variables > Actions). Zonder die secrets wordt de mailstap overgeslagen.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:               # handmatig starten via Actions > Inkoop-radar > Run workflow

permissions:
  contents: write

concurrency:
  group: inkoop-radar
  cancel-in-progress: false

env:
  PROFILES: profiles.json          # pad in de repo (zelfde map als inkoop.html)
  RESULTS: results.json

jobs:
  ophalen:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ophalen
        id: fetch
        run: node tools/inkoop-fetch.mjs "$PROFILES" "$RESULTS"

      - name: results.json vastleggen
        run: |
          git config user.name "inkoop-radar"
          git config user.email "inkoop-radar@users.noreply.github.com"
          git add "$RESULTS"
          git diff --cached --quiet || git commit -m "Inkoop-radar: resultaten $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet   # er kan intussen iets gepusht zijn
          git push

      # Optioneel: e-mail bij nieuwe advertenties.
      # Zet in Settings > Secrets and variables > Actions de secrets MAIL_TO, MAIL_USERNAME, MAIL_PASSWORD
      # (bijv. een Gmail-adres met een app-wachtwoord). Zonder MAIL_TO wordt deze stap overgeslagen.
      - name: E-mail bij nieuwe advertenties
        if: ${{ env.MAIL_TO != '' && steps.fetch.outputs.new == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Inkoop-radar: ${{ steps.fetch.outputs.count }} nieuwe advertentie(s)"
          to: ${{ secrets.MAIL_TO }}
          from: KAAP Inkoop-radar
          convert_markdown: true
          html_body: file://new_items.md

      # Optioneel: WhatsApp bij nieuwe advertenties, via de gratis dienst CallMeBot.
      # Zet de secrets CALLMEBOT_PHONE (jouw nummer met landcode, bijv. +31612345678)
      # en CALLMEBOT_APIKEY (die je van de bot krijgt). Zonder CALLMEBOT_PHONE
      # wordt deze stap overgeslagen.
      - name: WhatsApp bij nieuwe advertenties
        if: ${{ env.CALLMEBOT_PHONE != '' && steps.fetch.outputs.new == 'true' }}
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          tekst="$(node tools/wa-bericht.mjs new_items.md)"
          if [ -z "$tekst" ]; then
            echo "Niets te melden."
            exit 0
          fi
          antwoord=$(curl -s -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$CALLMEBOT_PHONE" \
            --data-urlencode "apikey=$CALLMEBOT_APIKEY" \
            --data-urlencode "text=$tekst" \
            -w "\n[status %{http_code}]")
          echo "$antwoord" | tail -3
