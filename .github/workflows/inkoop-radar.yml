# KAAP Inkoop-radar – ophaler
# Draait elke 2 uur, dag en nacht: leest profiles.json, schrijft results.json en stuurt
# optioneel een mail en/of WhatsApp bij een nieuwe treffer.
name: Inkoop-radar

on:
  # Elke 2 uur, op 17 minuten over het uur (UTC). Naast het hele uur start GitHub meestal
  # sneller; op het hele uur is het druk. Ook dan begint GitHub geplande taken vaak later en
  # slaat er bij drukte soms een over. Voor inkoop maakt dat niets uit.
  #
  # Melding bij een nieuwe treffer per mail en/of WhatsApp: zie de stappen onderaan.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:               # handmatig starten via Actions > Inkoop-radar > Run workflow
    inputs:
      testbericht:
        description: "Stuur een testbericht (mail en/of WhatsApp), ook als er niets nieuws is"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: inkoop-radar
  cancel-in-progress: false

env:
  # Sinds ophaler v1.17 op de tak "data" (map data/ in de run), niet meer op main: zo komen er geen commits van de
  # ophaler meer op main en hoeft de gebruiker in GitHub Desktop niet steeds Pull origin te doen (09-10-2026).
  PROFILES: data/profiles.json
  RESULTS: data/results.json

jobs:
  ophalen:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
    steps:
      # Altijd de nieuwste stand van main, niet die van het moment van starten: een run die moest wachten op een
      # andere run begint anders met oude resultaten en botst bij het wegzetten (run #14, 06-10-2026).
      - uses: actions/checkout@v7
        with:
          ref: main

      # De tak data met profiles.json en results.json. De eerste run na v1.17 maakt hem aan met de bestanden van main.
      - name: Tak data klaarzetten
        run: bash tools/tak-data.sh

      - uses: actions/checkout@v7
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ophalen
        id: fetch
        env:
          TESTBERICHT: ${{ inputs.testbericht }}
        run: node tools/inkoop-fetch.mjs "$PROFILES" "$RESULTS"

      # Melding bij een nieuwe treffer: alleen als de ophaler een nieuwe advertentie of een prijswijziging vond die
      # nog niet gemeld is (zie tools/melding.mjs). Geen bericht bij "niets nieuws".
      # Mail: secrets MAIL_TO (ontvanger), MAIL_USERNAME (Gmail-adres) en MAIL_PASSWORD (app-wachtwoord
      # van dat Gmail-account, niet het gewone wachtwoord). Zonder MAIL_TO wordt deze stap overgeslagen.
      # De mailactie staat vast op één versie (commit), zodat die later niet ongemerkt kan veranderen.
      - name: Mail bij een nieuwe treffer
        id: mail
        if: ${{ env.MAIL_TO != '' && steps.fetch.outputs.melding == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968   # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.fetch.outputs.onderwerp }}
          to: ${{ secrets.MAIL_TO }}
          from: KAAP Inkoop Radar <${{ secrets.MAIL_USERNAME }}>
          html_body: file://melding.html

      # WhatsApp bij een nieuwe treffer, via de gratis dienst CallMeBot. Secrets CALLMEBOT_PHONE
      # (jouw nummer met landcode, bijv. +31612345678) en CALLMEBOT_APIKEY (die je van de bot krijgt).
      - name: WhatsApp bij een nieuwe treffer
        id: whatsapp
        if: ${{ env.CALLMEBOT_PHONE != '' && steps.fetch.outputs.melding == 'true' }}
        continue-on-error: true
        env:
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        # CallMeBot antwoordt bij een fout met HTTP 203 en een tekst als "APIKey is invalid" (nagemeten 06-10-2026).
        # Dan faalt deze stap met een waarschuwing in de samenvatting van de run; de rest van de run gaat door.
        run: |
          antwoord=$(curl -s --max-time 60 -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=$CALLMEBOT_PHONE" \
            --data-urlencode "apikey=$CALLMEBOT_APIKEY" \
            --data-urlencode "text@melding.txt" \
            -w "\n%{http_code}")
          code=$(printf '%s' "$antwoord" | tail -n1)
          tekst=$(printf '%s' "$antwoord" | sed '$d' | sed 's/<[^>]*>/ /g' | tr -s ' \n' ' ' | sed -E 's/[+]?[0-9]{6,}/[nummer]/g')
          # CallMeBot herhaalt eerst het bericht zelf; de status staat aan het eind ("Your Account is ...").
          tekst=$(printf '%s' "$tekst" | tail -c 450)
          if [ "$code" = "200" ] && ! printf '%s' "$tekst" | grep -qiE 'invalid|error|blocked|not allowed|limit|wait'; then
            echo "CallMeBot: bericht aangenomen (HTTP 200)."
          else
            echo "::warning title=WhatsApp niet verstuurd::CallMeBot gaf HTTP $code: $tekst"
            exit 1
          fi

      # Een treffer telt pas als gemeld als WhatsApp of de mail hem echt heeft aangenomen (ophaler v1.17). Lukte dat
      # niet, dan blijft hij in results.json als voorstel staan en neemt de volgende ronde hem opnieuw mee.
      - name: Melding bevestigen
        if: ${{ steps.fetch.outputs.melding == 'true' && (steps.mail.outcome == 'success' || steps.whatsapp.outcome == 'success') }}
        continue-on-error: true
        run: node tools/melding-bevestigen.mjs "$RESULTS"

      # Pas na het versturen vastleggen, zodat results.json weet of het bericht is aangekomen.
      - name: results.json vastleggen (tak data)
        working-directory: data
        run: |
          git config user.name "inkoop-radar"
          git config user.email "inkoop-radar@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Inkoop-radar: resultaten $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs --quiet origin data   # de app kan intussen profiles.json hebben bijgewerkt; bij results.json wint deze ronde
          git push origin HEAD:data
