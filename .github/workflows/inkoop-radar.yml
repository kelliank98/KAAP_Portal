# KAAP Inkoop-radar – ophaler
# Draait elke 2 uur (07:00–22:00 NL-tijd), leest profiles.json, schrijft results.json en
# stuurt optioneel een e-mail bij nieuwe advertenties.
name: Inkoop-radar

on:
  # ---------------------------------------------------------------------------
  # AUTOMATISCH DRAAIEN STAAT UIT. Je start de radar zelf via
  # Actions > Inkoop-radar > Run workflow.
  #
  # Wil je mail bij nieuw aanbod? Doe dan twee dingen:
  #   1. Zet de secrets MAIL_TO, MAIL_USERNAME en MAIL_PASSWORD
  #      (Settings > Secrets and variables > Actions).
  #   2. Haal hieronder het hekje weg voor "schedule:" en voor EEN van de
  #      cron-regels. Laat de rest met hekje staan.
  #
  # De eerste drie ritmes draaien rond de klok. Dealers plaatsen vrijwel alleen
  # overdag, dus nachtrondes leveren zelden iets op - maar ze kosten niets.
  # Tijden zijn UTC. Nederland is in de zomer 2 uur later, in de winter 1 uur.
  # GitHub start geplande taken vaak een paar minuten later dan de klok aangeeft,
  # en slaat er bij drukte soms een over. Voor inkoop maakt dat niets uit.
  # ---------------------------------------------------------------------------
  # schedule:
  #   - cron: "*/30 * * * *"       # elk half uur, dag en nacht  (meeste kans op blokkades)
  #   - cron: "0 * * * *"          # elk uur, dag en nacht
  #   - cron: "0 */2 * * *"        # elke 2 uur, dag en nacht    (aanrader)
  #   - cron: "0 6,18 * * *"       # twee keer per dag, 08:00 en 20:00 NL-tijd
  #   - cron: "0 6 * * *"          # een keer per dag om 08:00 NL-tijd (zomertijd)
  #   - cron: "0 7 * * *"          # een keer per dag om 08:00 NL-tijd (wintertijd)
  workflow_dispatch:               # handmatig starten via Actions > Inkoop-radar > Run workflow

permissions:
  contents: write

concurrency:
  group: inkoop-radar
  cancel-in-progress: false

env:
  PROFILES: profiles.json          # pad in de repo (zelfde map als inkoop.html)
  RESULTS: results.json

jobs:
  ophalen:
    runs-on: ubuntu-latest
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ophalen
        id: fetch
        run: node tools/inkoop-fetch.mjs "$PROFILES" "$RESULTS"

      - name: results.json vastleggen
        run: |
          git config user.name "inkoop-radar"
          git config user.email "inkoop-radar@users.noreply.github.com"
          git add "$RESULTS"
          git diff --cached --quiet || git commit -m "Inkoop-radar: resultaten $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      # Optioneel: e-mail bij nieuwe advertenties.
      # Zet in Settings > Secrets and variables > Actions de secrets MAIL_TO, MAIL_USERNAME, MAIL_PASSWORD
      # (bijv. een Gmail-adres met een app-wachtwoord). Zonder MAIL_TO wordt deze stap overgeslagen.
      - name: E-mail bij nieuwe advertenties
        if: ${{ env.MAIL_TO != '' && steps.fetch.outputs.new == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Inkoop-radar: ${{ steps.fetch.outputs.count }} nieuwe advertentie(s)"
          to: ${{ secrets.MAIL_TO }}
          from: KAAP Inkoop-radar
          convert_markdown: true
          html_body: file://new_items.md
